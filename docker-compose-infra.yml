version: '3.8'

services:
  registry:
    image: registry:2
    container_name: devops-registry
    ports:
      - "5000:5000"
    restart: always

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile-jenkins
    container_name: devops-jenkins
    network_mode: host
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    command: --httpPort=8085
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube:/root/.kube
      - ${HOME}/.minikube:${HOME}/.minikube:ro
      - ../ApexPOS:/var/jenkins_home/ApexPOS
      - .:/var/jenkins_home/devops-repo
    restart: always

  watchtower:
    image: containrrr/watchtower
    container_name: devops-watchtower
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=10
      - WATCHTOWER_LABEL_ENABLE=true
    restart: always

  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    network_mode: host
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    restart: always

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    network_mode: host
    depends_on:
      - sonar-db
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://localhost:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: always

volumes:
  jenkins_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

