apiVersion: v1
kind: Service
metadata:
  name: {{ include "apexpos.fullname" . }}-backend
  labels:
    {{- include "apexpos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "apexpos.selectorLabels" . | nindent 4 }}
    app: {{ include "apexpos.fullname" . }}-backend
