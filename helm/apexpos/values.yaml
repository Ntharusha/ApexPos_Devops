# Global Configurations
global:
  environment: production
  namespace: apexpos

# Frontend Configuration
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/ntharusha/apexpos-frontend
    pullPolicy: Always
    tag: "latest"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Backend Configuration
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/ntharusha/apexpos-backend
    pullPolicy: Always
    tag: "latest"
  service:
    type: NodePort
    port: 5000
    nodePort: 30500
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    port: 5000
    nodeEnv: production
    allowedOrigins: "http://localhost,http://localhost:80,http://localhost:30500,http://localhost:30080,http://13.235.9.45,http://13.235.9.45:80,http://13.235.9.45:30080"
  secrets:
    jwtSecret: "eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtdGhpcy1pbi1wcm9kdWN0aW9u" # Default base64 encoded placeholder

# MongoDB Database Configuration
database:
  replicaCount: 1
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: "" # Defaults to cluster default storage class (gp2, standard, etc.)
    accessMode: ReadWriteOnce
    size: 1Gi

# Ingress Configuration (Production grade traffic routing)
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: apexpos.local
      paths:
        - path: /
          pathType: Prefix
          serviceType: frontend
        - path: /api
          pathType: Prefix
          serviceType: backend
  tls: []
  #  - secretName: apexpos-tls
  #    hosts:
  #      - apexpos.local
