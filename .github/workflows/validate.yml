name: Validate Configurations

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # Lint Kubernetes Manifests
  lint-k8s:
    name: Lint K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint

      - name: Run yamllint
        run: |
          echo "Running yamllint on Kubernetes configs..."
          # Configure relaxed rule definitions for development manifests
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}}}" k8s/
          echo "YAML syntax check complete."

  # Lint Helm Chart
  lint-helm:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run Helm Lint
        run: |
          echo "Running helm lint..."
          helm lint helm/apexpos/
          echo "Helm lint check complete."

  # Lint Dockerfiles
  lint-docker:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Jenkins Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile-jenkins
          # Ignore warning DL3008 (pinning apt versions) and DL3015 (recommends)
          ignore: DL3008,DL3015
