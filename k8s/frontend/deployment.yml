apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexpos-frontend
  namespace: apexpos
  labels:
    app: apexpos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apexpos-frontend
  template:
    metadata:
      labels:
        app: apexpos-frontend
    spec:
      containers:
        - name: frontend
          image: host.minikube.internal:5000/apexpos-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
