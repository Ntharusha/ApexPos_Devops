apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apexpos-backend-monitor
  namespace: monitoring
  labels:
    release: monitoring   # Must match the Helm release name of kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - apexpos           # Target the apexpos application namespace
  selector:
    matchLabels:
      app: apexpos-backend   # Must match the label on the backend Service
  endpoints:
    - port: http              # Named port in the backend Service
      path: /metrics          # Prometheus metrics endpoint on the Node.js backend
      interval: 30s
      scrapeTimeout: 10s
