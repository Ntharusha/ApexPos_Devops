apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexpos-database
  namespace: apexpos
  labels:
    app: apexpos-database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apexpos-database
  template:
    metadata:
      labels:
        app: apexpos-database
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          # Limit WiredTiger cache to 256MB (minimum allowed by MongoDB) to prevent OOM on t3.small (2GB RAM)
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            limits:
              cpu: 300m
              memory: 384Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
